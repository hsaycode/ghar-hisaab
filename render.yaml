# Render Blueprint (free plan, Docker). Set GROQ_API_KEY in the Render dashboard (never commit it).
services:
  - type: web
    name: ghar-hisaab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PER_IP_PER_MINUTE
        value: "20"
      - key: DAILY_AUDIO_SECONDS
        value: "6000"
      - key: DAILY_LLM_CALLS
        value: "900"
